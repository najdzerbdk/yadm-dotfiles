$MOD = SUPER
$launcher = vicinae
$terminal = kitty
$browser = brave
$sysmon = btop
$editor = nvim
$file_manager = yazi

cursor {
    env = XCURSOR_THEME,elementary
    env = XCURSOR_SIZE,24
  }

monitors {
    monitor=,preferred,auto,auto
    monitor=HDMI-A-1,1920x1080@100,0x0,1
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

ecosystem {
    no_update_news = false
    no_donation_nag = true
  }

startup {
    exec-once = ~/.config/hypr/xdg-portal-hyprland
    exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
    exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
    exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
    exec-once = sleep 1 && killall nm-applet
    exec-once = swww-daemon
    exec-once = waybar
    exec-once = waypaper --restore
    exec-once = systemctl enable --now --user vicinae.service 
}


decoration {
    rounding = 0
    dim_special = 0.5
    shadow {
        enabled = false
        sharp = false
        range = 20
        render_power = 2
        color = rgba(155,191,191,0.20)
        color_inactive = rgba(0,0,0,0)
    }
    blur { 
        enabled = false
        new_optimizations = on
        ignore_opacity = false
        size = 1
        passes = 1
        vibrancy = 0.1696
    }
}

#general {
#    # gaps_in = -1,-1,-1,-1
#    gaps_out = 10,10,10,10
#    border_size = 1
#    col.active_border = rgba(155,191,191,1)
#    col.inactive_border = rgba(155,191,191,0.30)
#    layout = dwindle
#}

general {
    # Zewnętrzne odstępy pomiędzy oknami a krawędzią ekranu
    gaps_out = 10,10,10,10

    # Wewnętrzne odstępy między oknami - ustawione na 0, aby zniknęły
    gaps_in = 0,0,0,0

    border_size = 1
    col.active_border = rgba(149,127,184,1)
    col.inactive_border = rgba(155,191,191,0.30)
    layout = dwindle
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

animations {
    enabled = yes
    first_launch_animation = true
    workspace_wraparound = false

    bezier = wind, 0.05, 1.0, 0.1, 1.05
    bezier = fade, 1, 1, 1, 1

    animation = specialWorkspaceIn, 1, 2, wind, slidevert
    animation = specialWorkspaceOut, 1, 4, wind, slidevert
    animation = windowsIn, 1, 2, wind, gnomed
    animation = windowsOut, 0
    animation = windowsMove, 1, 2.5, wind
    animation = workspaces, 1, 2, wind
    animation = fade, 1, 2, default
}

workspace-rules {
    # workspace = w[t1], gapsout:22
    # workspace = w[t2], gapsout:10
}

windowrules {
  windowrulev2 = bordercolor rgba(BCA4E0cc), floating:1
  windowrulev2 = float, class:org.gnome.Calculator
  windowrulev2 = float, class:org.manjaro.pamac.manager
  windowrulev2 = float, class:waypaper
  windowrule = float, class:Wiremix
  windowrule = size 36% 50%, class:Wiremix
  windowrule = size 70% 80%, class:org.manjaro.pamac.manager
  windowrule = size 70% 63%, class:waypaper
  windowrule = float, initialTitle:Friends List
  windowrule = float, class:xdg-desktop-portal-gtk
  # windowrule = floating, class:WireMix, above
  
}

layer-rules {
    layerrule = dimaround, $launcher
    #layerrule = ignorezero, brave
    #layerrule = ignorealpha 0.5, brave
}

binds {
    pass_mouse_when_bound = false

    bind = $MOD, RETURN, exec, $terminal
    bind = $MOD, Q, killactive,
    bind = $MOD SHIFT, M, exit,
    bind = $MOD, Z, exec, $browser
    bind = $MOD, E, exec, $terminal -e $file_manager
    bind = $MOD SHIFT, SPACE, togglefloating  
    bind = $MOD SHIFT, X,  exec, hyprlock
    bind = $MOD, SPACE, exec, $launcher
    bind = $MOD, V, exec, opilion
    bind = $MOD, X, togglesplit
    bind = $MOD, P, exec, hyprpicker
    bind = $MOD, PRINT, exec, hyprshot -m region
    bind = $MOD SHIFT, PRINT, exec, hyprshot -m window
    bind = ,PRINT, exec, hyprshot -m output -m HDMI-A-1

    bind = $MOD, TAB, togglespecialworkspace
    bind = $MOD, 1, workspace, 1
    bind = $MOD, 2, workspace, 2
    bind = $MOD, 3, workspace, 3
    bind = $MOD, 4, workspace, 4
    bind = $MOD, 5, workspace, 5
    bind = $MOD, 6, workspace, 6
    bind = $MOD, 7, workspace, 7
    bind = $MOD, 8, workspace, 8
    bind = $MOD, 9, workspace, 9

    bind = $MOD SHIFT, TAB, movetoworkspace, special
    bind = $MOD SHIFT, 1, movetoworkspace, 1
    bind = $MOD SHIFT, 2, movetoworkspace, 2
    bind = $MOD SHIFT, 3, movetoworkspace, 3
    bind = $MOD SHIFT, 4, movetoworkspace, 4
    bind = $MOD SHIFT, 5, movetoworkspace, 5
    bind = $MOD SHIFT, 6, movetoworkspace, 7
    bind = $MOD SHIFT, 7, movetoworkspace, 7
    bind = $MOD SHIFT, 8, movetoworkspace, 8
    bind = $MOD SHIFT, 9, movetoworkspace, 10

    bind = $MOD, F, fullscreen, 1
    bind = $MOD SHIFT, F, fullscreen,
    bind = $MOD, mouse_down, workspace, e+1
    bind = $MOD, mouse_up, workspace, e-1
    bindm = $MOD, mouse:272, movewindow
    bindm = $MOD, mouse:273, resizewindow

    bind = $MOD, A, movefocus, l
    bind = $MOD, D, movefocus, r
    bind = $MOD, W, movefocus, u
    bind = $MOD, S, movefocus, d

    bind = $MOD SHIFT, A, movewindow, l
    bind = $MOD SHIFT, D, movewindow, r
    bind = $MOD SHIFT, W, movewindow, u
    bind = $MOD SHIFT, S, movewindow, d

    binde = $MOD CTRL, left, resizeactive, -50 0
    binde = $MOD CTRL, right, resizeactive, 50 0
    binde = $MOD CTRL, up, resizeactive, 0 -50
    binde = $MOD CTRL, down, resizeactive, 0 50

    bind = $MOD SHIFT, F11, exec, playerctl play-pause
    bind = $MOD SHIFT, F10, exec, playerctl previous
    bind = $MOD SHIFT, F12, exec, playerctl next

    binde = $MOD, F12, exec,pamixer -i 5
    binde = $MOD, F11, exec,pamixer -d 5
    bind = $MOD, F10, exec,pamixer -t
    bind = $MOD, F9, exec, $terminal -e wiremix

}
