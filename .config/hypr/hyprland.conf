# ~/.config/hypr/hyprland.conf

######################################
# Ustawienia podstawowe
######################################
monitor = HDMI-A-1, 1920x1080@75, 0x0, 1
exec = gsettings set org.gnome.desktop.interface gtk-theme "YOUR_DARK_GTK3_THEME"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps
exec-once = ~/.config/hypr/scripts/spotfy-launch.sh
exec-once = brave
# Mod key (SUPER/Windows key)
$mod = SUPER/windows
# Restart Hyprlanda
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod CTRL SHIFT, R, exec, systemctl --user restart hyprland
bind = $mod SHIFT, Q, killactive
exec-once = waybar
# Czcionka w barach/launcherach ustawiasz osobno (np. waybar/rofi)
bindl = $mod SHIFT, X, exec, swaylock --color ffffff14
######################################
# Keybindy aplikacji (jak i3 exec)
######################################
# mod+Tab+1 → Brave
exec-once = systemctl enable --now --user vicinae.service
# mod+Tab+2..5 → terminal (możesz zmienić)
bind = $mod, TAB+2, exec, xterm
bind = $mod, TAB+3, exec, xterm
bind = $mod, TAB+4, exec, xterm
bind = $mod, TAB+5, exec, xterm
# screenshot
 bind =, Print, exec, grim -g "$(slurp)" - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png | dunstify "Screenshot of the region taken" -t 1000 # screenshot of a region
 bind = SHIFT, Print, exec, grim - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png | dunstify "Screenshot of whole screen taken" -t 1000 # screenshot of the whole screen
# Terminal
bind = $mod, RETURN, exec, kitty
# Mod = zwykle Super (Mod4)
bind = $mod SHIFT, K, exec, kitty ./dynamic_quick.sh
#bind = $mod SHIFT, K, exec, konsole ./dynamic.quick.sh
# Launcher (Rofi lub fuzzel)
#bind = $mod, D, exec, rofi -show run
bind = $mod, D, exec, vicinae
#bind = $mod, D, exec, sherlock
# Screenshot
bind = $mod, K, exec, flameshot gui

# Power menu (twoje skrypty)
bind = $mod SHIFT, E, exec, nwg-bar

# Plik HTML
bind = $mod, P, exec, xdg-open /home/najdza/Dokumenty/Launcher.html

######################################
# Window management (workspace, focus)
######################################
# Workspaces 1–10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Poruszanie się między oknami (vim-style)
bind = $mod SHIFT, A, movefocus, l
bind = $mod SHIFT, S, movefocus, d
bind = $mod SHIFT, W, movefocus, u
bind = $mod SHIFT, D, movefocus, r

# Przenoszenie okien
bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, DOWN, movewindow, d
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, RIGHT, movewindow, r

######################################
# Layout i tryby okien
######################################
# Fullscreen
bind = $mod, F, fullscreen

# Float
bind = $mod SHIFT, SPACE, togglefloating

# Split (Hyprland sam ogarnia split h/v, więc tylko podgląd)
bind = $mod, V, togglesplit # zmienia podział pion/poziom

######################################
# Resize mode (podobne do i3 mode resize)
######################################
bind = $mod, R, submap, resize

submap=resize
    binde=, left, resizeactive, -50 0
    binde=, right, resizeactive, 50 0
    binde=, up, resizeactive, 0 -50
    binde=, down, resizeactive, 0 50
    bind=, RETURN, submap, reset
    bind=, ESCAPE, submap, reset
submap=reset

######################################
# System i media keys
######################################
# Jasność
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Dźwięk
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

######################################
# Autostart
######################################
exec-once = nm-applet
exec-once = volumeicon
exec-once = flameshot
exec-once = systemctl enable --now --user vicinae.service
exec-once = feh --bg-scale /home/najdza/Obrazy/backgrounds/bg.jpg
exec-once = xss-lock -- i3lock -c 000000
######################################
# Style / borders / gaps
######################################
general {
    gaps_in = 5
    gaps_out = 5, 10, 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(24837BFF)
    col.inactive_border = rgba(21262daa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 1
    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 1
    }
}

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
windowrule = float,class:(authentication-agent)
windowrule = float,class:(org.pulseaudio.pavucontrol)
windowrule = float,initialClass:(qt5ct)
windowrule = float,initialClass:(desktop-portal)
windowrule = float,initialClass:(QQ)
windowrule = float,initialClass:(qqmusic)
windowrule = float,initialClass:(wechat)
windowrule = float,initialClass:(steam)
windowrule = float,initialClass:(org.shotcut.Shotcut)
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
}
# Reguła wymuszająca przejście Spotify na Pulpit 3
# Syntax: windowrule = [reguła], [klasa okna]
