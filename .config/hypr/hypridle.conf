general {
    lock_cmd = swaylock -f -c 000000   # czym blokujesz ekran
    before_sleep_cmd = swaylock -f -c 000000
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                      # 5 minut
    on-timeout = swaylock -f -c 000000
}

listener {
    timeout = 600                      # 10 minut
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = sh -c 'logger -t hypridle "Aktywność wejścia wykryta przy zablokowanym ekranie"; hyprctl dispatch dpms on'
}

